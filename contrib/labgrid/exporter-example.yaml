# Example Labgrid Exporter Configuration
#
# This file defines the hardware resources exported by a Labgrid exporter.
# Each exporter manages physical devices (boards) and exposes them to the coordinator.
#
# Deploy this file to a machine that has physical access to your test boards.
# Run: labgrid-exporter /path/to/exporter.yaml
#
# Reference: https://labgrid.readthedocs.io/en/latest/configuration.html#exporter-configuration

# Exporter hostname (used as identifier in coordinator)
hostname: lab-host-01

# Resources exported by this exporter
# Group name typically matches the board/place name
resources:
  # Raspberry Pi 4 board
  rpi4-slot1:
    # Serial console access
    RawSerialPort:
      port: "/dev/ttyUSB0"
      speed: 115200

    # Network-based serial (alternative)
    # NetworkSerialPort:
    #   host: "192.168.1.100"
    #   port: 4001

    # Power control via network PDU
    NetworkPowerPort:
      model: "netio"
      host: "pdu.local"
      index: 1

    # Or USB-based power control
    # USBPowerPort:
    #   match:
    #     ID_PATH: "pci-0000:00:14.0-usb-0:1:1.0"

    # SSH access to booted board
    NetworkService:
      address: "192.168.1.50"
      username: "root"

    # SD card multiplexer (optional, for automated flashing)
    # USBSDMuxDevice:
    #   match:
    #     ID_PATH: "pci-0000:00:14.0-usb-0:2:1.0"

  # i.MX8M Mini EVK
  imx8mm-board1:
    RawSerialPort:
      port: "/dev/ttyUSB1"
      speed: 115200

    # Power control via digital logic relay
    DigitalOutputRelay:
      host: "gpio-controller.local"
      index: 0

    NetworkService:
      address: "192.168.1.51"
      username: "root"

    # TFTP boot support
    TFTPProvider:
      internal: "/srv/tftp/imx8mm"
      external: "tftp://192.168.1.1"

  # QEMU virtual target (for testing without hardware)
  qemu-arm64:
    QEMUDriver:
      qemu_bin: "qemu-system-aarch64"
      machine: "virt"
      cpu: "cortex-a72"
      memory: "2G"
      extra_args: "-nographic"

# Place definitions (coordinator creates these automatically based on matches)
# You can also create places manually with: labgrid-client create-place <name>
