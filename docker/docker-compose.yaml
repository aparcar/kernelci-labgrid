# KernelCI Labgrid Scheduler Docker Compose Configuration
#
# Usage:
#   # Start push scheduler
#   docker-compose up -d labgrid-scheduler
#
#   # Start pull agent
#   docker-compose up -d labgrid-agent
#
#   # View logs
#   docker-compose logs -f

version: '3.8'

services:
  # Push mode scheduler
  # Subscribes to KernelCI API events and pushes jobs to Labgrid coordinators
  labgrid-scheduler:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: kernelci/labgrid-scheduler:latest
    container_name: labgrid-scheduler
    command: ["scheduler", "--config", "/app/config/labgrid-runtime.yaml", "--scheduler-config", "/app/config/labgrid-scheduler.yaml", "--workers", "4"]
    environment:
      - KCI_API_URL=${KCI_API_URL:-https://api.kernelci.org}
      - KCI_API_TOKEN=${KCI_API_TOKEN}
      - LABGRID_COORDINATOR=${LABGRID_COORDINATOR:-localhost:20408}
      - LABGRID_TOKEN=${LABGRID_TOKEN:-}
    volumes:
      - ./config:/app/config:ro
      - ssh-keys:/home/kernelci/.ssh:ro
    networks:
      - kernelci-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Pull mode agent
  # Polls KernelCI API for pending jobs (for firewalled labs)
  labgrid-agent:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: kernelci/labgrid-scheduler:latest
    container_name: labgrid-agent
    command: ["agent", "--lab-name", "${LAB_NAME:-my-lab}", "--coordinator", "${LABGRID_COORDINATOR:-localhost:20408}", "--poll-interval", "30"]
    environment:
      - KCI_API_URL=${KCI_API_URL:-https://api.kernelci.org}
      - KCI_API_TOKEN=${KCI_API_TOKEN}
      - LABGRID_COORDINATOR=${LABGRID_COORDINATOR:-localhost:20408}
      - LAB_NAME=${LAB_NAME:-my-lab}
    volumes:
      - ./config:/app/config:ro
      - ssh-keys:/home/kernelci/.ssh:ro
      - artifacts:/home/kernelci/artifacts
    networks:
      - kernelci-net
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Local Labgrid coordinator for development/testing
  labgrid-coordinator:
    image: labgrid/coordinator:latest
    container_name: labgrid-coordinator
    ports:
      - "20408:20408"
    networks:
      - kernelci-net
    restart: unless-stopped
    profiles:
      - development

  # Example exporter for development
  labgrid-exporter:
    image: labgrid/exporter:latest
    container_name: labgrid-exporter
    environment:
      - LG_COORDINATOR=labgrid-coordinator:20408
    volumes:
      - /dev:/dev
      - ./exporter-config.yaml:/etc/labgrid/exporter.yaml:ro
    privileged: true
    networks:
      - kernelci-net
    depends_on:
      - labgrid-coordinator
    restart: unless-stopped
    profiles:
      - development

networks:
  kernelci-net:
    name: kernelci-net
    driver: bridge

volumes:
  ssh-keys:
    name: labgrid-ssh-keys
  artifacts:
    name: labgrid-artifacts
