[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kernelci-labgrid"
version = "0.1.0"
description = "Pull agent to connect Labgrid test labs to KernelCI"
readme = "README.md"
license = "LGPL-2.1-or-later"
requires-python = ">=3.10"
authors = [
    { name = "KernelCI", email = "kernelci@lists.linux.dev" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v2 or later (LGPLv2+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
keywords = ["kernelci", "labgrid", "testing", "embedded", "linux"]

dependencies = [
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-json-report>=1.5.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "black>=24.0.0",
]

[project.scripts]
labgrid-pull-agent = "kernelci_labgrid.scheduler.pull_agent:main"

[project.urls]
Homepage = "https://github.com/kernelci/kernelci-labgrid"
Documentation = "https://docs.kernelci.org/"
Repository = "https://github.com/kernelci/kernelci-labgrid"
Issues = "https://github.com/kernelci/kernelci-labgrid/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kernelci_labgrid"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
