# Example labgrid-agent configuration.
#
#   labgrid-agent --config labgrid-agent.toml
#   labgrid-agent --config labgrid-agent.toml --show-config   # check settings
#
# Without --config the agent reads ./labgrid-agent.toml,
# ~/.config/labgrid-agent/config.toml or /etc/labgrid-agent/config.toml.
# Precedence (later wins): this file < --env-file < environment variables
# (LAB_NAME, KCI_API_URL, LAB_API_TOKEN, KCI_STORAGE_URL, LAB_STORAGE_TOKEN,
# LG_COORDINATOR, LAB_POOL, LABGRID_* paths)
# < command line options.
#
# On openwrtci, Ansible generates a ready-to-use file per lab
# (ansible/secrets/<server>/labs/<lab>.toml). Keep it secret: it holds tokens.
#
# Plain keys go first: TOML assigns keys after a [table] header to that table.

# Lab name; must match the runtime of the jobs (data.runtime)
lab_name = "my-lab"

# The lab's own labgrid-coordinator. Its places' `device=<platform>` tags
# are the hardware platforms this lab serves; places are reserved and locked
# per job (LG_COORDINATOR also works). Leave unset for a QEMU-only lab.
coordinator = "127.0.0.1:20408"

# Shared job pool (a runtime all participating labs are members of). Jobs
# scheduled to the pool go to whichever lab with the platform claims them
# first; jobs for lab_name itself are taken first (LAB_POOL also works).
# pool = "openwrt-labs"

# Optional: restrict the discovered hardware platforms, and add local QEMU
# platforms (labgrid target files targets/<platform>.yaml). Without a
# coordinator this is the full list.
# platforms = ["openwrt_one", "qemu_x86-64"]

# The test suite (pytest tests incl. conftest.py), the labgrid target files
# and the labgrid strategies they import. They can live anywhere; relative
# paths are relative to this file. pytest runs in tests_dir with the agent's
# own Python, which includes labgrid, pytest-check and pytest-harvest.
tests_dir = "openwrt-tests/tests"
targets_dir = "openwrt-tests/targets"     # default: <tests_dir>/../targets
# strategies_dir = "openwrt-tests/strategies"   # default: <targets_dir>/../strategies

# Optional settings (defaults shown)
# pytest_command = "uv run pytest"         # e.g. for a suite with its own environment
# labgrid_command = "labgrid-client"       # for power off; default: this environment's
# reserve_timeout = 60                     # seconds to wait for a free place
# poll_interval = 30                       # seconds between polls
# artifact_dir = "/var/lib/labgrid-agent/artifacts"   # default: a temp dir
# health_checks_dir = "/etc/labgrid-agent/health_checks"   # *.toml, one per device
# health_state_file = "/var/lib/labgrid-agent/health.json"  # keeps results across restarts

# Maestro (KernelCI) API, including the version prefix
[api]
url = "https://api.example.org/latest"
token = "<lab API token>"

# kernelci-storage for log uploads (optional; without it logs stay local)
[storage]
url = "https://files.example.org/"
token = "<lab storage token>"

# Health checks (optional): boot a known-good image on every platform each
# frequency_hours; a device whose check fails takes no jobs until one passes.
# The golden image comes from the target file (openwrt: section, see README).
# [health_checks]
# frequency_hours = 24
# release = "25.12.5"          # unless the target pins healthcheck_version
#
# [health_checks.rpi-4]
# enabled = false
