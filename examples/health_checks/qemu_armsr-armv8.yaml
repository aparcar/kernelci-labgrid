# Health Check Configuration for the QEMU arm64 (armsr-armv8) target
#
# Runs every 24 hours with a known-good OpenWrt release image to verify the
# device/infrastructure works. Results stay local (health state file) and
# gate job execution; they are not published to KernelCI.
#
# Place this file in your health checks directory (e.g. /etc/labgrid/health_checks/)

# Device identifier - must match the platform name in KernelCI jobs
device: qemu_armsr-armv8

# Labgrid target YAML file (relative to targets_dir)
target: qemu_armsr-armv8.yaml

# How often to run health checks (in hours)
frequency_hours: 24

# Golden image: firmware URL + optional sha256 (from the release profiles.json)
golden_image:
  firmware: https://downloads.openwrt.org/releases/25.12.5/targets/armsr/armv8/openwrt-25.12.5-armsr-armv8-generic-initramfs-kernel.bin
  sha256: f510b0c73c1ee70a64df384d7e2ad4404caf83e6bc7cce9ac13426f77b9ae3be

# pytest selection relative to tests_dir (empty = all tests)
test_path: test_base.py::test_shell test_base.py::test_ssh

# Test timeout in seconds
timeout: 600
