# Labgrid Target: OpenWrt Main Branch on QEMU x86_64
#
# Environment variables (set by labgrid-agent):
#   LG_KERNEL  - Path to kernel (bzImage)
#   LG_ROOTFS  - Path to rootfs (combined image or rootfs.img)

targets:
  main:
    resources:
      RemotePlace:
        name: openwrt-main-x86

    drivers:
      QEMUDriver:
        qemu_bin: qemu-system-x86_64
        machine: pc
        cpu: host
        memory: 512M
        disk: !template "$LG_ROOTFS"
        extra_args: >-
          -enable-kvm
          -nographic
          -serial mon:stdio
          -netdev user,id=wan,hostfwd=tcp::2222-:22
          -device virtio-net-pci,netdev=wan

      ShellDriver:
        prompt: 'root@OpenWrt:.*#'
        login_prompt: 'login:'
        username: root
        login_timeout: 120
        console_ready: 'Please press Enter to activate this console'

      SSHDriver:
        host: localhost
        port: 2222
        username: root
        password: ""

options:
  # Test configuration
  branch: main
  platform: x86_64

  # OpenWrt specifics
  openwrt_target: x86
  openwrt_subtarget: "64"

  # URLs for main branch images (updated nightly)
  image_base_url: "https://downloads.openwrt.org/snapshots/targets/x86/64/"
